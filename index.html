    // Mapa pelo numero_siafi para buscar dados do convênio (status vem daqui)
    const mapa = new Map();
    dadosCompletos.forEach(d => { if (d.numero_siafi) mapa.set(d.numero_siafi, d); });
    // Conjunto de SIAFIs presentes no conveniossaida — somente esses serão exibidos
    // (e dadosCompletos já vem filtrado para status Vigente/Encerrado)
    const siafiValidos = new Set(mapa.keys());
    // Mapa código UO → nome do órgão (preenchido em carregarEEnriquecerEmpenhos)
    const mapaOrgaoNome = window._mapaOrgaoNome || new Map();

    // Gerar UMA LINHA POR EXERCÍCIO DE CADA EMPENHO (e não mais uma linha única
    // consolidando todos os anos). Um mesmo empenho pode ter movimentação em
    // vários exercícios (orçamento do ano + Restos a Pagar pagos em anos
    // seguintes); cada um desses anos vira sua própria linha na tabela, com
    // os valores (empenhado/liquidado/pago) referentes SOMENTE àquele ano —
    // usando o detalhamento por ano que já vem em e.detalhes.
    const resultado = [];
    dadosEmpenhos.forEach(e => {
        const siafi = e.numero_siafi;
        // Ignorar empenhos cujo SIAFI não existe no conveniossaida
        if (!siafi || !siafiValidos.has(siafi)) return;
        const conv = mapa.get(siafi) || {};
        // Nome do órgão: unidade orçamentária do empenho, ou mapa por código, ou fallback do convênio
        const nomeOrgao = e.uo_nome || mapaOrgaoNome.get(e.uo_codigo) || conv.orgao || conv.descricao_orgao || '';

        // Agrupar os detalhes (linhas originais por ano/tipo orc|rp) por exercício,
        // somando os valores de cada ano separadamente.
        const porAno = new Map();
        (e.detalhes || []).forEach(p => {
            const ano = p.ano_exercicio || '';
            if (!porAno.has(ano)) porAno.set(ano, {
                valor_empenhado: 0, valor_liquidado: 0,
                vp_financeiro: 0, vp_processado: 0, vp_nao_processado: 0, valor_pago: 0,
            });
            const agr = porAno.get(ano);
            agr.valor_empenhado   += p.valor_empenhado;
            agr.valor_liquidado   += p.valor_liquidado;
            agr.vp_financeiro     += p.vp_financeiro;
            agr.vp_processado     += p.vp_processado;
            agr.vp_nao_processado += p.vp_nao_processado;
            agr.valor_pago        += p.valor_pago;
        });

        // Fallback: se por algum motivo não houver e.detalhes (não deveria ocorrer),
        // mantém o comportamento anterior de uma única linha consolidada.
        if (porAno.size === 0) {
            const exercicios = (e.exercicios || []).slice().sort();
            porAno.set(exercicios.join(', ') || e.ano_exercicio || '', {
                valor_empenhado: e.valor_empenhado, valor_liquidado: e.valor_liquidado,
                vp_financeiro: e.vp_financeiro, vp_processado: e.vp_processado,
                vp_nao_processado: e.vp_nao_processado, valor_pago: e.valor_pago,
            });
        }

        // Uma linha por exercício, ordenadas do mais recente para o mais antigo
        [...porAno.keys()].sort((a, b) => b.localeCompare(a)).forEach(ano => {
            const v = porAno.get(ano);
            resultado.push({
                ano:               conv.ano || '',
                ano_exercicio:     ano,
                exercicios:        [ano],
                numero_convenio:   conv.numero_convenio || '',
                orgao:             nomeOrgao,
                descricao_orgao:   conv.descricao_orgao || nomeOrgao,
                sigla_orgao:       e.uo_sigla || conv.sigla || '',
                numero_siafi:      siafi,
                numero_empenho:    e.numero_empenho || '',
                emp_data:          e.data_empenho || '',
                // Razão social/CNPJ: prioritariamente do convênio (conveniossaida), fallback do credor do empenho
                razao_social:      conv.razao_social || e.credor_razao || '',
                cnpj_proponente:   conv.cnpj_proponente || e.credor_cnpj || '',
                // Status: sempre do convênio (conveniossaida)
                status:            conv.status || '',
                elemento:          e.elemento_desc || '',
                fonte:             e.fonte_desc || '',
                valor_empenhado:   v.valor_empenhado,
                valor_liquidado:   v.valor_liquidado,
                vp_financeiro:     v.vp_financeiro,
                vp_processado:     v.vp_processado,
                vp_nao_processado: v.vp_nao_processado,
                valor_pago:        v.valor_pago,
            });
        });
    });
    return resultado.filter(r => r.numero_siafi);
}

function gerarLinhasPG(dados) {
    if (!dados || dados.length === 0) return '<tr><td colspan="12" class="text-center py-4">Nenhum registro encontrado</td></tr>';
    return dados.map(d => `<tr>
        <td style="white-space:nowrap">${d.ano_exercicio||'-'}</td>
        <td title="${d.orgao||''}">${(d.orgao||'-').substring(0,30)}${(d.orgao||'').length>30?'...':''}</td>
        <td><a href="#" class="processo-link" onclick="verDetalhes('${(d.numero_siafi||'').replace(/'/g,"\\'")}');return false;">${d.numero_siafi||'-'}</a></td>
        <td>${linkInteiroTeor(d.numero_convenio)}</td>
        <td style="white-space:nowrap;font-weight:600;color:#1a3a5c">${d.numero_empenho||'-'}</td>
        <td style="white-space:nowrap">${d.emp_data ? formatarData(d.emp_data) : '-'}</td>
        <td title="${d.razao_social||''}">${(d.razao_social||'-').substring(0,35)}${(d.razao_social||'').length>35?'...':''}</td>
        <td>${d.cnpj_proponente||'-'}</td>
        <td><span class="badge-status ${getBadgeStatus(d.status)}">${d.status||'-'}</span></td>
        <td class="text-right">${d.valor_empenhado ? formatarMoeda(d.valor_empenhado) : '<span class="nao-aplica">—</span>'}</td>
        <td class="text-right">${d.valor_liquidado ? formatarMoeda(d.valor_liquidado) : '<span class="nao-aplica">—</span>'}</td>
        <td class="text-right" style="font-weight:700;color:#28a745" title="Financeiro: ${formatarMoeda(d.vp_financeiro)} | RP Processado: ${formatarMoeda(d.vp_processado)} | RP Não Processado: ${formatarMoeda(d.vp_nao_processado)}">${formatarMoeda(d.valor_pago)}</td>
    </tr>`).join('');
}

function atualizarTabelaPG() {
    const dados = window.pgfiltrados || [];
    const inicio = (paginacaoPG.paginaAtual - 1) * paginacaoPG.itensPorPagina;
    const pagina = dados.slice(inicio, inicio + paginacaoPG.itensPorPagina);
    document.getElementById('tbodyPG').innerHTML = gerarLinhasPG(pagina);
    document.getElementById('badgePG').textContent = `${dados.length} registros`;
    renderizarPaginacaoPG();
}

function renderizarPaginacaoPG() {
    const pag = paginacaoPG;
    const dados = window.pgfiltrados || [];
    const container = document.getElementById('paginacaoPG');
    if (!container) return;
    if (dados.length === 0) { container.innerHTML = '<div class="pagination-info">Nenhum registro encontrado</div>'; return; }
    const totalPag = Math.ceil(dados.length / pag.itensPorPagina);
    pag.totalPaginas = totalPag;
    const inicio = (pag.paginaAtual - 1) * pag.itensPorPagina + 1;
    const fim = Math.min(pag.paginaAtual * pag.itensPorPagina, dados.length);
    let html = `<div class="pagination-info"><span>Mostrando ${inicio.toLocaleString('pt-BR')}–${fim.toLocaleString('pt-BR')} de ${dados.length.toLocaleString('pt-BR')} registros</span>
        <div class="page-size-selector"><span>Por pág:</span><select id="ippPG" onchange="alterarIppPG()"><option value="25" ${pag.itensPorPagina==25?'selected':''}>25</option><option value="50" ${pag.itensPorPagina==50?'selected':''}>50</option><option value="100" ${pag.itensPorPagina==100?'selected':''}>100</option></select></div></div>`;
    html += `<div class="pagination-controls">
        <button onclick="mudarPaginaPG(1)" ${pag.paginaAtual===1?'disabled':''} title="Primeira"><i class="fas fa-angle-double-left"></i></button>
        <button onclick="mudarPaginaPG(${pag.paginaAtual-1})" ${pag.paginaAtual===1?'disabled':''} title="Anterior"><i class="fas fa-angle-left"></i></button>`;
    let ini2 = Math.max(1, pag.paginaAtual-2), fim2 = Math.min(totalPag, ini2+4);
    if (ini2 > 1) { html += `<button onclick="mudarPaginaPG(1)">1</button>`; if(ini2>2) html += `<span style="padding:0 4px">…</span>`; }
    for (let i=ini2; i<=fim2; i++) html += `<button onclick="mudarPaginaPG(${i})" class="${i===pag.paginaAtual?'active':''}">${i}</button>`;
    if (fim2 < totalPag) { if(fim2<totalPag-1) html += `<span style="padding:0 4px">…</span>`; html += `<button onclick="mudarPaginaPG(${totalPag})">${totalPag}</button>`; }
    html += `<button onclick="mudarPaginaPG(${pag.paginaAtual+1})" ${pag.paginaAtual===totalPag?'disabled':''} title="Próxima"><i class="fas fa-angle-right"></i></button>
        <button onclick="mudarPaginaPG(${totalPag})" ${pag.paginaAtual===totalPag?'disabled':''} title="Última"><i class="fas fa-angle-double-right"></i></button></div>`;
    container.innerHTML = html;
}

window.mudarPaginaPG = function(p) {
    if (p < 1 || p > paginacaoPG.totalPaginas) return;
    paginacaoPG.paginaAtual = p;
    atualizarTabelaPG();
};

window.alterarIppPG = function() {
    paginacaoPG.itensPorPagina = parseInt(document.getElementById('ippPG').value);
    paginacaoPG.paginaAtual = 1;
    atualizarTabelaPG();
};

function toggleSortPG(col) {
    if (sortConfigPG.coluna===col) sortConfigPG.direcao = sortConfigPG.direcao==='asc'?'desc':'asc';
    else { sortConfigPG.coluna=col; sortConfigPG.direcao='desc'; }
    window.pgfiltrados = ordenarDados(window.pgfiltrados, sortConfigPG.coluna, sortConfigPG.direcao);
    paginacaoPG.paginaAtual = 1;
    atualizarTabelaPG();
}

window.aplicarFiltrosPG = function() {
    const ano     = document.getElementById('filtroAnoPG')?.value;
    const orgao   = (document.getElementById('filtroOrgaoPG')?.value||'').toLowerCase().trim();
    const siafi   = (document.getElementById('filtroSiafiPG')?.value||'').toLowerCase().trim();
    const empenho = (document.getElementById('filtroEmpenhoPG')?.value||'').toLowerCase().trim();
    const cnpj    = (document.getElementById('filtroCnpjPG')?.value||'').replace(/\D/g,'');
    const status  = document.getElementById('filtroStatusPG')?.value;
    const razao   = (document.getElementById('filtroRazaoPG')?.value||'').toLowerCase().trim();
    const base    = construirDadosPagamentos();
    dadosPagamentosFiltrados = base.filter(d => {
        if (ano     && !(d.exercicios||[]).map(String).includes(String(ano))) return false;
        if (orgao   && !(d.orgao||'').toLowerCase().includes(orgao)) return false;
        if (siafi   && !(d.numero_siafi||'').toLowerCase().includes(siafi)) return false;
        if (empenho && !(d.numero_empenho||'').toLowerCase().includes(empenho)) return false;
        if (cnpj    && !(d.cnpj_proponente||'').replace(/\D/g,'').includes(cnpj)) return false;
        if (status  && d.status !== status) return false;
        if (razao   && !(d.razao_social||'').toLowerCase().includes(razao)) return false;
        return true;
    });
    window.pgfiltrados = ordenarDados(dadosPagamentosFiltrados, sortConfigPG.coluna, sortConfigPG.direcao);
    paginacaoPG.paginaAtual = 1;
    paginacaoPG.totalPaginas = Math.ceil(window.pgfiltrados.length / paginacaoPG.itensPorPagina);
    atualizarTabelaPG();
};

window.limparFiltrosPG = function() {
    ['filtroAnoPG','filtroStatusPG'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    ['filtroOrgaoPG','filtroSiafiPG','filtroEmpenhoPG','filtroCnpjPG','filtroRazaoPG'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    dadosPagamentosFiltrados = construirDadosPagamentos();
    window.pgfiltrados = ordenarDados(dadosPagamentosFiltrados, sortConfigPG.coluna, sortConfigPG.direcao);
    paginacaoPG.paginaAtual = 1;
    paginacaoPG.totalPaginas = Math.ceil(window.pgfiltrados.length / paginacaoPG.itensPorPagina);
    atualizarTabelaPG();
};

window.buscarPG = function(termo) {
    const t = (termo||'').toLowerCase().trim();
    const base = window.pgfiltrados || [];
    const filtrado = t ? base.filter(d =>
        (d.numero_siafi||'').toLowerCase().includes(t) ||
        (d.numero_convenio||'').toLowerCase().includes(t) ||
        (d.numero_empenho||'').toLowerCase().includes(t) ||
        (d.razao_social||'').toLowerCase().includes(t) ||
        (d.orgao||'').toLowerCase().includes(t) ||
        (d.cnpj_proponente||'').toLowerCase().includes(t)
    ) : base;
    document.getElementById('tbodyPG').innerHTML = gerarLinhasPG(filtrado.slice(0, paginacaoPG.itensPorPagina));
    document.getElementById('badgePG').textContent = `${filtrado.length} registros`;
};

        ...dados.map(d=>[d.ano_exercicio,d.orgao,d.numero_siafi,d.numero_convenio,urlInteiroTeor(d.numero_convenio)||'',d.numero_empenho,formatarData(d.emp_data),d.razao_social,d.cnpj_proponente,d.status,d.valor_empenhado,d.valor_liquidado,d.vp_financeiro,d.vp_processado,d.vp_nao_processado,d.valor_pago].map(c=>`"${(c??'').toString().replace(/"/g,'""')}"`).join(';'))
    ].join('\n');
    const blob = new Blob(['\uFEFF'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pagamentos_convenios.csv'; a.click();

    navigator.clipboard.writeText(window.location.href).then(() => {
        const toast = document.getElementById('toastSucesso');

document.addEventListener('click', e => {
    if (!e.target.closest('.column-selector')) document.querySelectorAll('.column-selector-dropdown').forEach(d => d.classList.remove('show'));
});

document.addEventListener('DOMContentLoaded', () => {
    setupAtualizacaoData();
    carregarDados();

    // Fix modal inside iframe: preserve scroll position and prevent layout shift
    const detailModal = document.getElementById('detailModal');
    if (detailModal) {
        let savedScrollY = 0;
        detailModal.addEventListener('show.bs.modal', () => {
            savedScrollY = window.scrollY;
        });
        detailModal.addEventListener('shown.bs.modal', () => {
            // Prevent Bootstrap from adding padding-right to body (scrollbar compensation)
            document.body.style.paddingRight = '0px';
            document.body.style.overflow = 'auto';
            document.body.style.position = 'static';
            // Restore scroll position if Bootstrap moved it
            window.scrollTo(0, savedScrollY);
        });
        detailModal.addEventListener('hidden.bs.modal', () => {
            document.body.style.paddingRight = '';
            document.body.style.overflow = '';
            document.body.style.position = '';
            window.scrollTo(0, savedScrollY);
            setTimeout(iframeUpdateHeight, 200);
        });
        // Block Bootstrap from setting body paddingRight at all
        const observer = new MutationObserver(() => {
            if (document.body.style.paddingRight && document.body.style.paddingRight !== '0px') {
                document.body.style.paddingRight = '0px';
            }
            if (document.body.style.overflow === 'hidden') {
                document.body.style.overflow = 'auto';
            }
        });
        observer.observe(document.body, { attributes: true, attributeFilter: ['style'] });
    }

    document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
        tab.addEventListener('shown.bs.tab', (e) => {
            // Se a aba de pagamentos for clicada e ainda estiver em estado de carregamento, tentar re-renderizar
            if (e.target.id === 'pagamentos-tab' && dadosEmpenhos && dadosEmpenhos.length > 0) {
                const pg = document.getElementById('pagamentos-content');
                if (pg && pg.querySelector('.spinner-border')) renderizarPagamentos();
            }
            setTimeout(iframeUpdateHeight, 300);
        });
    });
    window.addEventListener('resize', () => { clearTimeout(window.resizeTimer); window.resizeTimer = setTimeout(iframeUpdateHeight, 250); });
});

// Iframe resize observer - debounced to prevent infinite resize loop
(function() {
    let lastHeight = 0;
    let sendTimer = null;
    function sendHeight() {
        clearTimeout(sendTimer);
        sendTimer = setTimeout(function() {
            if (window.__modalAberto) return; // não redimensiona o iframe com o modal aberto
            const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 20;
            if (h !== lastHeight) {
                lastHeight = h;
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ iframeHeight: h, height: h, type: 'resize' }, '*');
                    }
                } catch(e) {}
            }
        }, 100);
    }
    if (window.ResizeObserver) {
        let roTimer = null;
        const ro = new ResizeObserver(function() {
            clearTimeout(roTimer);
            roTimer = setTimeout(sendHeight, 150);
        });
        ro.observe(document.body);
    } else {
        window.addEventListener('resize', sendHeight);
    }
    setTimeout(sendHeight, 500);
})();
</script>
